server.port=8761
spring.application.name=discovery-server

# ---------- Configuracion del servidor Eureka ----------
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://eureka:eureka2026@localhost:8761/eureka/
eureka.server.wait-time-in-ms-when-sync-empty=0

# ---------- Logging ----------
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO

# ---------- Autenticacion basica para el dashboard/API de Eureka ----------
spring.security.user.name=eureka
spring.security.user.password=eureka2026