# auth-server: configuracion local (solo secretos).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ---------- OAuth 2.0 Client: GitHub ----------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:configure-GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:configure-GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.client-name=GitHub
