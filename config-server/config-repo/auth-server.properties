# ============================================================
# Configuracion de auth-server.
# Servidor de autenticacion OAuth 2.0:
#   1. El usuario inicia sesion con GitHub 
#   2. auth-server emite un JWT propio firmado con RSA 
#   3. Los microservicios validan la firma con la clave publica 
# ============================================================

server.port=9000

# ---------- JWT emitido por este servidor ----------
auth.jwt.issuer=http://localhost:9000
auth.jwt.audience=banco-xyz
auth.jwt.expiration-seconds=3600

# ---------- Permisos (scopes) que se incluyen en el token ----------
auth.scopes.lectura=clientes.read cuentas.read pagos.read
auth.scopes.operacion=clientes.write cuentas.write pagos.write
auth.operadores=${AUTH_OPERADORES:}

# ---------- Cliente del banco asociado al login de GitHub (claim clienteId) ----------
auth.clientes-github=${AUTH_CLIENTES_GITHUB:}
auth.cliente-por-defecto=${AUTH_CLIENTE_POR_DEFECTO:1}

# ---------- BFF registrados como clientes OAuth 2.0 ----------
auth.bff.bff-web.secret=${BFF_WEB_SECRET:bff-web-secreto-2026}
auth.bff.bff-web.canal=web
auth.bff.bff-web.scopes=clientes.read clientes.write cuentas.read cuentas.write pagos.read pagos.write
auth.bff.bff-web.expiracion-segundos=300

# Movil: sin cuentas.write ni clientes.write
auth.bff.bff-movil.secret=${BFF_MOVIL_SECRET:bff-movil-secreto-2026}
auth.bff.bff-movil.canal=movil
auth.bff.bff-movil.scopes=clientes.read cuentas.read pagos.read pagos.write
auth.bff.bff-movil.expiracion-segundos=300

# Cajero: el BFF valida tarjeta + PIN y luego pide
# un token de sesion de 2 minutos a nombre de ese cliente y esa cuenta.
auth.bff.bff-cajero.secret=${BFF_CAJERO_SECRET:bff-cajero-secreto-2026}
auth.bff.bff-cajero.canal=cajero
auth.bff.bff-cajero.scopes=cuentas.read pagos.read pagos.write
auth.bff.bff-cajero.scopes-servicio=tarjetas.verify
auth.bff.bff-cajero.expiracion-segundos=120
auth.bff.bff-cajero.asegurar-cliente=true

# ---------- Cookie de sesion propia ----------
server.servlet.session.cookie.name=AUTHSERVERSESSION

# ---------- Eureka ----------
eureka.client.service-url.defaultZone=http://eureka:eureka2026@${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.duoc.bancoxyz.auth=DEBUG
