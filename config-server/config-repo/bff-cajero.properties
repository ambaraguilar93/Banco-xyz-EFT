# ============================================================
# bff-cajero - Backend for Frontend del canal CAJERO (EFT Parte 2)
# ============================================================
server.port=${PUERTO:8445}

# ---------- HTTPS (certificado propio de este BFF, firmado por la CA de desarrollo) ----------
server.ssl.enabled=true
server.ssl.key-store=classpath:bff-cajero.p12
server.ssl.key-store-password=${SSL_PASSWORD:bancoxyz2026}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-cajero

# Actuator en un puerto interno aparte
management.server.port=9445
management.server.ssl.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Hilos virtuales
spring.threads.virtual.enabled=true

# ---------- Cliente OAuth 2.0 de este BFF ante el auth-server (tokens delegados) ----------
bff.oauth.client-id=bff-cajero
bff.oauth.client-secret=${BFF_CAJERO_SECRET:bff-cajero-secreto-2026}

# ---------- Valida los JWT de los usuarios (mismo auth-server que los microservicios) ----------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${AUTH_SERVER_HOST:localhost}:9000/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.audiences=banco-xyz

# ---------- Eureka: se registra con su puerto HTTPS ----------
eureka.client.service-url.defaultZone=http://eureka:eureka2026@${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.hostname}:${server.port}
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}

# ---------- Resilience4j: un circuito por cada servicio del backend ----------
resilience4j.circuitbreaker.instances.msClientes.slidingWindowSize=10
resilience4j.circuitbreaker.instances.msClientes.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.msClientes.failureRateThreshold=50
resilience4j.circuitbreaker.instances.msClientes.waitDurationInOpenState=15000
resilience4j.circuitbreaker.instances.msClientes.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.msClientes.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.msClientes.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.msClientes.allowHealthIndicatorToFail=false
resilience4j.circuitbreaker.instances.msClientes.ignoreExceptions=org.springframework.web.client.HttpClientErrorException,com.duoc.bancoxyz.bff.cajero.delegacion.DelegacionTokens$TokenNoDelegableException,com.duoc.bancoxyz.bff.cajero.comun.AccesoDenegadoException,com.duoc.bancoxyz.bff.cajero.comun.ReglaNegocioException
resilience4j.circuitbreaker.instances.msCuentas.slidingWindowSize=10
resilience4j.circuitbreaker.instances.msCuentas.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.msCuentas.failureRateThreshold=50
resilience4j.circuitbreaker.instances.msCuentas.waitDurationInOpenState=15000
resilience4j.circuitbreaker.instances.msCuentas.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.msCuentas.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.msCuentas.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.msCuentas.allowHealthIndicatorToFail=false
resilience4j.circuitbreaker.instances.msCuentas.ignoreExceptions=org.springframework.web.client.HttpClientErrorException,com.duoc.bancoxyz.bff.cajero.delegacion.DelegacionTokens$TokenNoDelegableException,com.duoc.bancoxyz.bff.cajero.comun.AccesoDenegadoException,com.duoc.bancoxyz.bff.cajero.comun.ReglaNegocioException
resilience4j.circuitbreaker.instances.msPagos.slidingWindowSize=10
resilience4j.circuitbreaker.instances.msPagos.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.msPagos.failureRateThreshold=50
resilience4j.circuitbreaker.instances.msPagos.waitDurationInOpenState=15000
resilience4j.circuitbreaker.instances.msPagos.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.msPagos.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.msPagos.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.msPagos.allowHealthIndicatorToFail=false
resilience4j.circuitbreaker.instances.msPagos.ignoreExceptions=org.springframework.web.client.HttpClientErrorException,com.duoc.bancoxyz.bff.cajero.delegacion.DelegacionTokens$TokenNoDelegableException,com.duoc.bancoxyz.bff.cajero.comun.AccesoDenegadoException,com.duoc.bancoxyz.bff.cajero.comun.ReglaNegocioException
resilience4j.circuitbreaker.instances.authServer.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authServer.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.authServer.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authServer.waitDurationInOpenState=15000
resilience4j.circuitbreaker.instances.authServer.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.authServer.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.authServer.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authServer.allowHealthIndicatorToFail=false
resilience4j.circuitbreaker.instances.authServer.ignoreExceptions=org.springframework.web.client.HttpClientErrorException,com.duoc.bancoxyz.bff.cajero.delegacion.DelegacionTokens$TokenNoDelegableException,com.duoc.bancoxyz.bff.cajero.comun.AccesoDenegadoException,com.duoc.bancoxyz.bff.cajero.comun.ReglaNegocioException

# ---------- Propio del canal cajero: mTLS ----------
# El servidor EXIGE certificado de cliente y solo confia en la CA de la red de cajeros
server.ssl.client-auth=need
server.ssl.trust-store=classpath:cajeros-truststore.p12
server.ssl.trust-store-password=${SSL_PASSWORD:bancoxyz2026}
server.ssl.trust-store-type=PKCS12
bff.cajero.espera-resultado-ms=6000

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [bff-cajero:${HOSTNAME:local}] [%thread] [%X{correlationId:-sin-id}] [%X{terminal:-}] %logger{25} - %msg%n
