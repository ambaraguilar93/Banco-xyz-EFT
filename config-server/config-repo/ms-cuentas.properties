# ============================================================
# ms-cuentas - Gestion de Cuentas
# ============================================================
# Varias instancias: con Docker cada contenedor usa 8201 internamente
# (docker compose up --scale ms-cuentas=2) - sin Docker: PUERTO=8202
server.port=${PUERTO:8201}

# ---------- Base de datos (misma BD que el batch, tablas propias) ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banco_xyz}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:hola123}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=MsCuentasPool
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-cuentas.sql
spring.sql.init.continue-on-error=true

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=8000
spring.kafka.consumer.auto-offset-reset=earliest
banco.kafka.particiones=3
cuentas.kafka.concurrencia=3

# ---------- Transactional Outbox ----------
banco.outbox.intervalo-ms=1000

# ---------- Logging: instancia + hilo + ID de correlacion ----------
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [ms-cuentas:${HOSTNAME:local}] [%thread] [%X{correlationId:-sin-id}] %logger{25} - %msg%n
logging.level.org.apache.kafka=WARN

# ---------- OAuth 2.0 Resource Server ----------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${AUTH_SERVER_HOST:localhost}:9000/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.audiences=banco-xyz

# ---------- Eureka ----------
eureka.client.service-url.defaultZone=http://eureka:eureka2026@${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.hostname}:${server.port}

# ---------- Actuator (monitoreo) ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ---------- Resilience4j ----------
resilience4j.circuitbreaker.instances.cuentasDb.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.cuentasDb.allowHealthIndicatorToFail=false
resilience4j.circuitbreaker.instances.cuentasDb.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cuentasDb.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.cuentasDb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cuentasDb.waitDurationInOpenState=15000
resilience4j.circuitbreaker.instances.cuentasDb.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.cuentasDb.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.cuentasDb.ignoreExceptions=com.duoc.bancoxyz.cuentas.comun.RecursoNoEncontradoException,com.duoc.bancoxyz.cuentas.comun.ReglaNegocioException,org.springframework.dao.DuplicateKeyException
resilience4j.circuitbreaker.instances.kafka.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.kafka.allowHealthIndicatorToFail=false
resilience4j.circuitbreaker.instances.kafka.slidingWindowSize=6
resilience4j.circuitbreaker.instances.kafka.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.kafka.failureRateThreshold=50
resilience4j.circuitbreaker.instances.kafka.waitDurationInOpenState=20000
resilience4j.circuitbreaker.instances.kafka.permittedNumberOfCallsInHalfOpenState=1
resilience4j.circuitbreaker.instances.kafka.automaticTransitionFromOpenToHalfOpenEnabled=true
