# Perfil 'fallo-critico': el primer step de agregacion falla una vez. El job queda
# FAILED, EjecutorJobs lo reejecuta automaticamente y Spring Batch retoma
# desde ese step sin volver a cargar el CSV.
#
# Se activa con: ./mvnw spring-boot:run "-Dspring-boot.run.profiles=fallo-critico"
banco.simular.fallo-critico=true
