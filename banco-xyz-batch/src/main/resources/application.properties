spring.application.name=banco-xyz-batch

# ---------- Base de datos ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banco_xyz}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:hola123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.batch.jdbc.initialize-schema=always

# Los jobs se lanzan manualmente desde BancoXyzBatchApplication para poder
# controlar el orden y capturar el resultado de cada uno.
spring.batch.job.enabled=false

# ---------- Pool de conexiones ----------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=BancoXyzPool

# ---------- Origen de datos ----------
banco.data.directorio=data
banco.archivo.transacciones=movimientos_financieros_diarios.csv
banco.archivo.intereses=intereses_trimestrales.csv
banco.archivo.cuentas-anuales=estados_financieros_anuales.csv

# ---------- Directorio de salida (errores.csv) ----------
banco.salida.directorio=salida

# ---------- Escalado y paralelismo ----------
banco.chunk.tamano=5
banco.paralelismo.hilos=3
banco.paralelismo.cola=25
banco.paralelismo.prefijo=Batch-Thread-

# ---------- Politicas de tolerancia a fallos ----------
banco.skip.limite=100
banco.retry.intentos=3

# ---------- Control de finalizacion ----------
banco.calidad.umbral-rechazo=0.5

# ---------- Simulacion de fallo transitorio ----------
banco.simular.fallo-transitorio=false
banco.simular.cantidad-fallos=2

# ---------- EFT: reejecucion automatica ante fallos criticos ----------
banco.reejecucion.intentos=2
banco.reejecucion.espera-ms=3000
banco.simular.fallo-critico=false

# ---------- Parametros de negocio ----------
banco.tasa.ahorro=0.005
banco.tasa.prestamo=0.015
banco.edad.minima=18
banco.edad.maxima=100

